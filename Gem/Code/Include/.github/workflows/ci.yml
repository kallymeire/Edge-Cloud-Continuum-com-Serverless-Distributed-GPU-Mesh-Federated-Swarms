name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Validate Python Scripts
      run: |
        python -m py_compile Pipeline/run_simulation.py
        python -m py_compile Pipeline/core/domain_randomizer.py
        python -m py_compile Pipeline/core/llm_agent_bridge.py
        echo "All Python scripts compiled successfully!"